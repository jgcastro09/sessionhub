<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeStage - Task Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>NodeStage</h1>
          <span>Task Board</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="header-controls">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Pesquisar por ID, título, resumo, tag..." autocomplete="off">
          <button id="clearSearch" class="clear-btn" style="display:none;">&times;</button>
        </div>

        <div class="filter-group">
          <select id="filterType" title="Filtrar por Tipo">
            <option value="">Todos os Tipos</option>
            <option value="Ideia">Ideia</option>
            <option value="Implementação">Implementação</option>
            <option value="Melhoria">Melhoria</option>
            <option value="Ajuste">Ajuste</option>
            <option value="Bug">Bug</option>
            <option value="Correção">Correção</option>
          </select>

          <select id="filterPriority" title="Filtrar por Prioridade">
            <option value="">Todas as Prioridades</option>
            <option value="Crítica">Crítica</option>
            <option value="Alta">Alta</option>
            <option value="Média">Média</option>
            <option value="Baixa">Baixa</option>
          </select>

          <select id="sortBy" title="Ordenar por">
            <option value="updated_desc">Atualizados (Mais recentes)</option>
            <option value="created_desc">Criados (Mais recentes)</option>
            <option value="priority_desc">Prioridade (Alta -> Baixa)</option>
            <option value="id_asc">ID (Crescente)</option>
          </select>
        </div>

        <button id="btnCopyPromptRule" class="btn btn-secondary" title="Copiar regra de prompt para a IA formatar o card">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copiar Regra de Prompt
        </button>

        <button id="btnImportCard" class="btn btn-secondary" title="Paste a complete AI-generated Card">
          Import Card
        </button>

        <button id="btnAuditCards" class="btn btn-secondary" title="Run deterministic repository audits for configured Cards">
          Audit Cards
        </button>

        <button id="btnNewCard" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Novo Card
        </button>
      </div>
    </header>

    <!-- Main Board -->
    <main class="board-wrapper">
      <div class="kanban-board" id="kanbanBoard">
        <!-- Coluna 1: Ideias -->
        <div class="kanban-column" data-status="Ideias">
          <div class="column-header">
            <div class="column-title">
              <span class="status-indicator status-ideias"></span>
              <h2>Ideias</h2>
            </div>
            <span class="card-count" id="count-Ideias">0</span>
          </div>
          <div class="card-list" id="list-Ideias"></div>
        </div>

        <!-- Coluna 2: Pendente -->
        <div class="kanban-column" data-status="Pendente">
          <div class="column-header">
            <div class="column-title">
              <span class="status-indicator status-pendente"></span>
              <h2>Pendente</h2>
            </div>
            <span class="card-count" id="count-Pendente">0</span>
          </div>
          <div class="card-list" id="list-Pendente"></div>
        </div>

        <!-- Coluna 3: Em andamento -->
        <div class="kanban-column" data-status="Em andamento">
          <div class="column-header">
            <div class="column-title">
              <span class="status-indicator status-em-andamento"></span>
              <h2>Em andamento</h2>
            </div>
            <span class="card-count" id="count-Em andamento">0</span>
          </div>
          <div class="card-list" id="list-Em andamento"></div>
        </div>

        <!-- Coluna 4: Ajuste necessário -->
        <div class="kanban-column" data-status="Ajuste necessário">
          <div class="column-header">
            <div class="column-title">
              <span class="status-indicator status-ajuste-necessario"></span>
              <h2>Ajuste necessário</h2>
            </div>
            <span class="card-count" id="count-Ajuste necessário">0</span>
          </div>
          <div class="card-list" id="list-Ajuste necessário"></div>
        </div>

        <!-- Coluna 5: Implementado (Recolhida por padrão) -->
        <div class="kanban-column collapsed" data-status="Implementado" id="col-Implementado">
          <div class="column-header clickable-toggle" id="toggle-Implementado">
            <div class="column-title">
              <span class="status-indicator status-implementado"></span>
              <h2>Implementado</h2>
              <span class="collapsed-badge" id="count-Implementado">0</span>
            </div>
            <button class="btn-toggle" title="Expandir/Recolher">
              <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
          <div class="card-list" id="list-Implementado"></div>
        </div>

        <!-- Coluna 6: Arquivado (Recolhida por padrão) -->
        <div class="kanban-column collapsed" data-status="Arquivado" id="col-Arquivado">
          <div class="column-header clickable-toggle" id="toggle-Arquivado">
            <div class="column-title">
              <span class="status-indicator status-arquivado"></span>
              <h2>Arquivado</h2>
              <span class="collapsed-badge" id="count-Arquivado">0</span>
            </div>
            <button class="btn-toggle" title="Expandir/Recolher">
              <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
          <div class="card-list" id="list-Arquivado"></div>
        </div>
      </div>
    <!-- Card Detail/Edit Modal -->
  <div class="modal-backdrop" id="cardModal" style="display: none;">
    <div class="modal-window card-modal-window" data-view="split">
      <div class="modal-header">
        <div class="modal-title-row">
          <span class="card-id-badge" id="modalCardId">TASK-NOVO</span>
          <button type="button" id="btnCopyModalPrompt" class="btn-copy-card-prompt" title="Copy AI prompt for this card" style="display:none;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy Prompt</span>
          </button>
          <select id="modalType" class="select-badge">
            <option value="Ideia">Ideia</option>
            <option value="Implementação">Implementação</option>
            <option value="Melhoria">Melhoria</option>
            <option value="Ajuste">Ajuste</option>
            <option value="Bug">Bug</option>
            <option value="Correção">Correção</option>
          </select>
          <select id="modalPriority" class="select-badge">
            <option value="Crítica">Crítica</option>
            <option value="Alta">Alta</option>
            <option value="Média" selected>Média</option>
            <option value="Baixa">Baixa</option>
          </select>
          <select id="modalStatus" class="select-badge">
            <option value="Ideias">Ideias</option>
            <option value="Pendente">Pendente</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Ajuste necessário">Ajuste necessário</option>
            <option value="Implementado">Implementado</option>
            <option value="Arquivado">Arquivado</option>
          </select>
        </div>

        <div class="modal-header-actions">
          <div class="modal-view-toggle">
            <button type="button" class="btn-view-toggle active" data-view="split" title="Side-by-Side Split View">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="12" y1="3" x2="12" y2="21"></line>
              </svg>
              <span>Split View</span>
            </button>
            <button type="button" class="btn-view-toggle" data-view="edit" title="Form Edit Only">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 2 2h14a2 2 0 0 2 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <span>Edit</span>
            </button>
            <button type="button" class="btn-view-toggle" data-view="preview" title="Formatted Markdown Only">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Markdown</span>
            </button>
          </div>
          <button class="modal-close" id="btnCloseModal">&times;</button>
        </div>
      </div>

      <div class="modal-body-split">
        <!-- Form Pane (Left) -->
        <div class="modal-form-pane" id="modalFormPane">
          <div class="form-group">
            <label for="modalTitle">Título Direto</label>
            <input type="text" id="modalTitle" placeholder="Título claro e direto da tarefa...">
          </div>

          <div class="form-group">
            <label for="modalSummary">Resumo de Uma Frase</label>
            <input type="text" id="modalSummary" placeholder="Resumo conciso de uma frase...">
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label for="modalAreas">Áreas / Sistemas Envolvidos (separados por vírgula)</label>
              <input type="text" id="modalAreas" placeholder="Ex: Licensing, Build System, UI...">
            </div>
          </div>

          <div class="form-group">
            <label for="modalDescription">Descrição Detalhada</label>
            <textarea id="modalDescription" rows="4" placeholder="Detalhes técnicos completos, contexto e motivação..."></textarea>
          </div>

          <div class="form-group">
            <label for="modalPrompt">Prompt Detalhado para a IA</label>
            <textarea id="modalPrompt" rows="3" placeholder="Instruções e escopo específico para a IA executar a tarefa..."></textarea>
          </div>

          <div class="form-group">
            <label for="modalExpected">Funcionalidades Esperadas</label>
            <textarea id="modalExpected" rows="3" placeholder="Critérios de aceitação e comportamentos esperados..."></textarea>
          </div>

          <div class="form-group">
            <label for="modalAuditContract">Audit Contract</label>
            <textarea id="modalAuditContract" rows="4" placeholder="- source: relative/path contains literal&#10;- registry: relative/path&#10;- validation: code-registry-validate"></textarea>
          </div>

          <div class="form-group">
            <label for="modalAuditReport">Audit Report</label>
            <textarea id="modalAuditReport" rows="4" readonly placeholder="Run Audit Cards to generate deterministic evidence."></textarea>
          </div>

          <!-- Seção de Implementação / Solução -->
          <div class="form-group highlight-box" id="sectionImplementation">
            <label for="modalCompletionSummary">Resumo do que foi Implementado</label>
            <textarea id="modalCompletionSummary" rows="3" placeholder="Descreva sucintamente a solução applied..."></textarea>
          </div>

          <!-- Seção de Observações / Problemas Restantes -->
          <div class="form-group warning-box" id="sectionNotes">
            <label for="modalNotes">Observações / Problemas Restantes ou Motivo do Ajuste</label>
            <textarea id="modalNotes" rows="3" placeholder="Anote ressalvas, débitos técnicos..."></textarea>
          </div>

          <div class="card-timestamps" id="modalTimestamps">
            <span id="lblCreatedAt">Criado: -</span>
            <span id="lblUpdatedAt">Atualizado: -</span>
            <span id="lblCompletedAt">Implementado: -</span>
          </div>
        </div>

        <!-- Markdown Preview Pane (Right) -->
        <div class="modal-preview-pane" id="modalPreviewPane">
          <div class="preview-header">
            <span>📄 Visualização Formatada (.md)</span>
            <span id="previewTokenMetrics" class="preview-metrics-badge">Full .md</span>
          </div>
          <div class="markdown-body" id="modalMarkdownContent">
            <!-- Formatted Markdown HTML renders here -->
          </div>
        </div>
      </div>"lblCompletedAt">Implementado: -</span>
        </div>

      </div>

      <div class="modal-footer">
        <button id="btnDeleteCard" class="btn btn-danger" style="display:none;">Excluir Card</button>
        <div class="modal-actions-right">
          <button id="btnCancelModal" class="btn btn-secondary">Cancelar</button>
          <button id="btnSaveCard" class="btn btn-primary">Salvar Alterações</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="importCardModal" style="display: none;">
    <div class="modal-window import-card-window">
      <div class="modal-header">
        <div class="modal-title-row"><strong>Import Card</strong></div>
        <button class="modal-close" id="btnCloseImportCard">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="importCardText">Paste the complete Card generated by the prompt rule</label>
          <textarea id="importCardText" rows="20" placeholder="Paste Title, Summary, Type, Priority, Areas, Detailed Description, Detailed AI Prompt, and Expected Features."></textarea>
        </div>
        <p id="importCardMetrics" class="import-card-metrics" hidden></p>
        <p id="importCardError" class="import-card-error" hidden></p>
      </div>
      <div class="modal-footer">
        <div class="modal-actions-right">
          <button id="btnCancelImportCard" class="btn btn-secondary" type="button">Cancel</button>
          <button id="btnConfirmImportCard" class="btn btn-primary" type="button">Import Card</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/card-importer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
