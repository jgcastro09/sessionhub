<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NodeStage Code Registry Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="topbar">
      <a class="brand" href="#overview" aria-label="Code Registry overview">
        <span class="brand-mark" aria-hidden="true">NS</span>
        <span><strong>Code Registry</strong><small>Architecture Explorer</small></span>
      </a>
      <label class="global-search">
        <span aria-hidden="true">⌕</span>
        <input id="global-search" type="search" placeholder="Search files, features, modules, responsibilities…" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="topbar-actions">
        <span class="generated-at" id="generated-at">Loading registry…</span>
        <button class="button secondary" id="reload-data" type="button">Reload data</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Primary navigation">
      <nav id="primary-nav">
        <a href="#overview" data-view="overview"><span>◫</span>Overview</a>
        <a href="#architecture" data-view="architecture"><span>⌘</span>Architecture</a>
        <a href="#product-areas" data-view="product-areas"><span>◇</span>Product Areas</a>
        <a href="#nodes" data-view="nodes"><span>⬡</span>Nodes</a>
        <a href="#relationships" data-view="relationships"><span>⌁</span>Relationships</a>
        <a href="#code-reader" data-view="code-reader"><span>⌘</span>Code Reader</a>
        <a href="#global-code-search" data-view="global-code-search"><span>⌕</span>Global Search</a>
        <a href="#git-audit" data-view="git-audit"><span>◆</span>Git Audit</a>
        <a href="#review-queue" data-view="review-queue"><span>!</span>Review Queue <em id="pending-badge">0</em></a>
        <a href="#uncategorized" data-view="uncategorized"><span>?</span>Uncategorized <em id="uncategorized-badge">0</em></a>
        <a href="#all-files" data-view="all-files"><span>≡</span>All Files</a>
      </nav>
      <section class="sidebar-status" id="sidebar-status" aria-label="Registry status"></section>
    </aside>

    <main class="content" id="main-content" tabindex="-1"></main>

    <aside class="inspector" id="inspector" aria-label="Selection inspector" aria-hidden="true">
      <div class="inspector-header">
        <span class="eyebrow" id="inspector-type">Selection</span>
        <button class="icon-button" id="close-inspector" type="button" aria-label="Close inspector">×</button>
      </div>
      <div id="inspector-content"></div>
    </aside>
  </div>

  <div class="search-panel" id="search-panel" hidden>
    <div class="search-panel-header">
      <strong id="search-title">Search results</strong>
      <button class="icon-button" id="close-search" type="button" aria-label="Close search results">×</button>
    </div>
    <div id="search-results"></div>
  </div>

  <div class="loading" id="loading" role="status"><span></span>Loading Code Registry…</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/cytoscape.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
